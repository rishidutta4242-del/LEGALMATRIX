    <script>
      // Suppress benign Vite HMR websocket disconnection errors from displaying error overlays
      (function() {
        function isHmrError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.stack || String(err));
          return str.indexOf('WebSocket closed without opened') !== -1 ||
                 str.indexOf('[vite] failed to connect to websocket') !== -1 ||
                 str.indexOf('WebSocket') !== -1;
        }

        // Monkey-patch WebSocket to prevent unhandled rejection/errors from Vite HMR client
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            try {
              var ws = protocols ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);
              ws.addEventListener('error', function(e) {
                if (typeof url === 'string' && (url.indexOf('localhost') !== -1 || url.indexOf('127.0.0.1') !== -1 || url.indexOf('vite') !== -1)) {
                  e.stopImmediatePropagation && e.stopImmediatePropagation();
                  e.preventDefault && e.preventDefault();
                }
              });
              return ws;
            } catch (err) {
              return {};
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isHmrError(event.message) || isHmrError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isHmrError(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
